<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis · Acceso Personal Autorizado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div><strong>VITALIS</strong> · Hospital Universitario Erasmo Meoz</div>
        <a href="index.html">← Portal del Paciente</a>
    </header>

    <div class="card login-box">
        <h2>Acceso Interno (ACT-02)</h2>
        <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 1.5rem;">
            Ingrese sus credenciales institucionales para gestionar agendas y citas.
        </p>

        <div id="mensajeError" class="alert alert-error" style="display: none;"></div>

        <form id="loginForm">
            <label for="usuario">Identificador de acceso</label>
            <input type="text" id="usuario" placeholder="Ej: admin_huem" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <p style="font-size: 0.8rem; color: #64748b; margin-top: 1rem; text-align: center;">
            Demo: <strong>admin_huem</strong> / <strong>123456</strong>
        </p>
    </div>

    <script>
        // Si ya hay sesión activa, redirigir al panel
        if (localStorage.getItem('vitalis_sesion')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;

            // Credenciales simuladas para el prototipo académico
            if ((user === 'admin_huem' && pass === '123456') || (user === 'medico_huem' && pass === '123456')) {
                const datosSesion = {
                    usuario: user,
                    nombre: user === 'admin_huem' ? 'Personal Administrativo HUEM' : 'Médico Especialista HUEM',
                    rol: user === 'admin_huem' ? 'Administrativo' : 'Médico'
                };
                localStorage.setItem('vitalis_sesion', JSON.stringify(datosSesion));
                window.location.href = 'dashboard.html';
            } else {
                const errorDiv = document.getElementById('mensajeError');
                errorDiv.textContent = 'Identificador de acceso o contraseña incorrectos.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
