<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis | Acceso Personal Autorizado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden grid grid-cols-1 md:grid-cols-12">
        
        <!-- Panel Izquierdo Institucional -->
        <div class="md:col-span-5 bg-gradient-to-br from-sky-950 via-sky-900 to-teal-900 text-white p-8 md:p-10 flex flex-col justify-between">
            <div>
                <div class="w-12 h-12 rounded-2xl bg-teal-500 flex items-center justify-center font-bold text-2xl shadow-lg shadow-teal-500/30 mb-6">
                    +
                </div>
                <h1 class="text-2xl font-bold tracking-tight">VITALIS</h1>
                <p class="text-sky-200 text-sm mt-1">Hospital Universitario Erasmo Meoz</p>
                <p class="text-sky-100/80 text-sm mt-6 leading-relaxed">
                    Plataforma interna para el control de agendas clínicas, validación de solicitudes y gestión de excepciones médicas.
                </p>
            </div>

            <div class="pt-8 border-t border-white/10 mt-8">
                <a href="index.html" class="inline-flex items-center gap-2 text-sm text-teal-300 hover:text-white font-semibold transition">
                    <span>←</span>
                    <span>Volver al portal de pacientes</span>
                </a>
            </div>
        </div>

        <!-- Panel Derecho Formulario -->
        <div class="md:col-span-7 p-8 md:p-12 flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h2>
            <p class="text-sm text-slate-500 mt-1 mb-6">Ingresa tus credenciales de personal autorizado</p>

            <div id="mensajeError" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-5"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Identificador de Acceso</label>
                    <input type="text" id="usuario" placeholder="Ej: admin_huem" required class="w-full rounded-xl border border-slate-300 bg-slate-50/50 px-4 py-3 text-sm focus:bg-white focus:border-sky-600 focus:ring-4 focus:ring-sky-600/10 outline-none transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Contraseña Institucional</label>
                    <input type="password" id="password" placeholder="••••••••" required class="w-full rounded-xl border border-slate-300 bg-slate-50/50 px-4 py-3 text-sm focus:bg-white focus:border-sky-600 focus:ring-4 focus:ring-sky-600/10 outline-none transition">
                </div>

                <button type="submit" class="w-full bg-sky-900 hover:bg-sky-800 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-sky-900/15 transition">
                    Ingresar al Panel
                </button>
            </form>

            <div class="mt-8 bg-slate-50 border border-slate-200/80 rounded-xl p-4 text-xs text-slate-500 flex justify-between items-center">
                <span><strong>Demo Admin:</strong> admin_huem</span>
                <span><strong>Clave:</strong> 123456</span>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('vitalis_sesion')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;

            const cuentas = {
                'admin_huem': { nombre: 'Coord. Admisiones HUEM', rol: 'Administrativo' },
                'medico_huem': { nombre: 'Dr. Especialista HUEM', rol: 'Médico' }
            };

            if (cuentas[user] && pass === '123456') {
                localStorage.setItem('vitalis_sesion', JSON.stringify({ usuario: user, ...cuentas[user] }));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('mensajeError');
                err.textContent = 'Credenciales inválidas. Verifica tu usuario y contraseña.';
                err.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
