<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis | Acceso Personal Autorizado</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f4c81;
            --primary-dark: #0a355c;
            --accent: #0d9488;
            --bg: #f1f5f9;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .navbar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.15);
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            background: var(--accent);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.3rem;
        }
        .brand-text h1 { margin: 0; font-size: 1.15rem; }
        .brand-text span { font-size: 0.78rem; opacity: 0.85; display: block; }
        .btn-nav {
            background: rgba(255, 255, 255, 0.14);
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.25); }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 2.2rem;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(15, 76, 129, 0.08);
            border: 1px solid var(--border);
        }
        .card-top { text-align: center; margin-bottom: 1.8rem; }
        .card-top .logo-big {
            background: var(--accent);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: 700;
            margin: 0 auto 12px;
        }
        .card-top h2 { margin: 0; font-size: 1.25rem; color: var(--primary); }
        .card-top p { margin: 5px 0 0; font-size: 0.85rem; color: var(--muted); }
        label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #334155; }
        input {
            display: block;
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 1.2rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.12); }
        .btn-primary {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.86rem;
            margin-bottom: 1.2rem;
        }
        .demo-box {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.82rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon">+</div>
            <div class="brand-text">
                <h1>VITALIS</h1>
                <span>Hospital Universitario Erasmo Meoz</span>
            </div>
        </div>
        <a href="index.html" class="btn-nav">← Volver al Portal Paciente</a>
    </nav>

    <div class="login-wrapper">
        <div class="card">
            <div class="card-top">
                <div class="logo-big">+</div>
                <h2>Portal Administrativo y Médico</h2>
                <p>Autenticación de personal autorizado</p>
            </div>

            <div id="mensajeError" class="alert-error" style="display: none;"></div>

            <form id="loginForm">
                <label for="usuario">Identificador de acceso</label>
                <input type="text" id="usuario" placeholder="Ej: admin_huem" required>

                <label for="password">Contraseña institucional</label>
                <input type="password" id="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>

            <div class="demo-box">
                Credenciales de demostración:<br>
                Usuario: <strong>admin_huem</strong> | Clave: <strong>123456</strong>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('vitalis_sesion')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;

            const cuentas = {
                'admin_huem': { nombre: 'Coord. Admisiones HUEM', rol: 'Administrativo' },
                'medico_huem': { nombre: 'Dr. Especialista HUEM', rol: 'Médico' }
            };

            if (cuentas[user] && pass === '123456') {
                localStorage.setItem('vitalis_sesion', JSON.stringify({ usuario: user, ...cuentas[user] }));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('mensajeError');
                err.textContent = 'Credenciales inválidas. Verifique su identificador y contraseña.';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
