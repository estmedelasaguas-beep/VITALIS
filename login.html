<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitalis | Acceso Personal Autorizado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <div class="brand-icon">+</div>
            <div class="brand-text">
                <h1>VITALIS</h1>
                <span>Hospital Universitario Erasmo Meoz</span>
            </div>
        </div>
        <a href="index.html" class="btn-nav">← Volver al Portal Paciente</a>
    </nav>

    <div class="container" style="max-width: 420px; margin-top: 4rem;">
        <div class="card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div class="brand-icon" style="margin: 0 auto 10px; width: 46px; height: 46px; font-size: 1.5rem;">+</div>
                <h3 style="margin: 0; color: var(--primary);">Portal Administrativo y Médico</h3>
                <p style="margin: 4px 0 0; font-size: 0.85rem; color: var(--muted);">Autenticación de personal autorizado</p>
            </div>

            <div id="mensajeError" class="alert-error" style="display: none;"></div>

            <form id="loginForm">
                <label for="usuario">Identificador de acceso</label>
                <input type="text" id="usuario" placeholder="Ej: admin_huem" required>

                <label for="password">Contraseña institucional</label>
                <input type="password" id="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary">Ingresar al Sistema</button>
            </form>

            <div style="margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); text-align: center;">
                Credenciales de demostración:<br>
                Usuario: <strong>admin_huem</strong> | Clave: <strong>123456</strong>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('vitalis_sesion')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;

            const cuentas = {
                'admin_huem': { nombre: 'Coord. Admisiones HUEM', rol: 'Administrativo' },
                'medico_huem': { nombre: 'Dr. Especialista HUEM', rol: 'Médico' }
            };

            if (cuentas[user] && pass === '123456') {
                localStorage.setItem('vitalis_sesion', JSON.stringify({ usuario: user, ...cuentas[user] }));
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('mensajeError');
                err.textContent = 'Credenciales inválidas. Verifique su identificador y contraseña.';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
